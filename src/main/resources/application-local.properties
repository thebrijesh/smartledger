# ════════════════════════════════════════════════════════════════════════════════════
# Local Development Configuration (connects to Docker services)
# ════════════════════════════════════════════════════════════════════════════════════
# Use this when running Spring Boot locally but connecting to Docker services

spring.application.name=smartledger
server.port=5000

# ═══════════════════════════════════════════════════════════════════════════════════
# Docker Services Connection (when running app locally)
# ═══════════════════════════════════════════════════════════════════════════════════
spring.datasource.url=jdbc:mysql://localhost:3307/khatabook
spring.datasource.username=smartledger
spring.datasource.password=smartledger123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Redis connection (Docker service)
spring.redis.host=localhost
spring.redis.port=6380

# ═══════════════════════════════════════════════════════════════════════════════════
# JPA Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ═══════════════════════════════════════════════════════════════════════════════════
# Actuator for health checks
# ═══════════════════════════════════════════════════════════════════════════════════
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ═══════════════════════════════════════════════════════════════════════════════════

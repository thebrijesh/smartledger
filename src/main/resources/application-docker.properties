# ════════════════════════════════════════════════════════════════════════════════════
# Docker Profile Configuration for SmartLedger
# ════════════════════════════════════════════════════════════════════════════════════
# This configuration is activated when SPRING_PROFILES_ACTIVE=docker

# ═══════════════════════════════════════════════════════════════════════════════════
# Application Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
spring.application.name=smartledger
server.port=5000

# ═══════════════════════════════════════════════════════════════════════════════════
# Database Configuration (Docker Environment)
# ═══════════════════════════════════════════════════════════════════════════════════
# Using environment variables for database connection
# These will be set by Docker Compose
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/khatabook}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartledger}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:smartledger123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ═══════════════════════════════════════════════════════════════════════════════════
# JPA/Hibernate Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ═══════════════════════════════════════════════════════════════════════════════════
# Connection Pool Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
spring.datasource.hikari.connection-timeout=60000
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# ═══════════════════════════════════════════════════════════════════════════════════
# Redis Configuration (Docker Environment)
# ═══════════════════════════════════════════════════════════════════════════════════
spring.redis.host=${SPRING_REDIS_HOST:redis}
spring.redis.port=${SPRING_REDIS_PORT:6379}
spring.redis.timeout=2000ms
spring.redis.jedis.pool.max-active=8
spring.redis.jedis.pool.max-idle=8
spring.redis.jedis.pool.min-idle=0
spring.redis.jedis.pool.max-wait=-1ms

# ═══════════════════════════════════════════════════════════════════════════════════
# Logging Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
logging.level.com.sml.smartledger=INFO
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Log to file in Docker
logging.file.name=/app/logs/smartledger.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.total-size-cap=100MB
logging.logback.rollingpolicy.max-history=7

# ═══════════════════════════════════════════════════════════════════════════════════
# Security Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
# OAuth2 configuration (if needed)
# spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
# spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}

# ═══════════════════════════════════════════════════════════════════════════════════
# File Upload Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ═══════════════════════════════════════════════════════════════════════════════════
# Actuator Configuration (for health checks)
# ═══════════════════════════════════════════════════════════════════════════════════
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
management.health.redis.enabled=true
management.health.db.enabled=true

# ═══════════════════════════════════════════════════════════════════════════════════
# Performance Optimization
# ═══════════════════════════════════════════════════════════════════════════════════
spring.jpa.open-in-view=false
server.compression.enabled=true
server.compression.min-response-size=2048

# ════════════════════════════════════════════════════════════════════════════════════
# Redis Configuration for SmartLedger
# ════════════════════════════════════════════════════════════════════════════════════
# This file configures Redis server settings for optimal performance

# ═══════════════════════════════════════════════════════════════════════════════════
# Network Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# ═══════════════════════════════════════════════════════════════════════════════════
# General Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
daemonize no
supervised no
pidfile /var/run/redis_6379.pid
loglevel notice
databases 16

# ═══════════════════════════════════════════════════════════════════════════════════
# Persistence Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
# Enable AOF (Append Only File) for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# RDB Snapshots (backup)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb

# ═══════════════════════════════════════════════════════════════════════════════════
# Memory Management
# ═══════════════════════════════════════════════════════════════════════════════════
maxmemory 256mb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# ═══════════════════════════════════════════════════════════════════════════════════
# Security Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
# Uncomment and set password in production
# requirepass your-redis-password-here

# ═══════════════════════════════════════════════════════════════════════════════════
# Client Configuration
# ═══════════════════════════════════════════════════════════════════════════════════
maxclients 1000

# ════════════════════════════════════════════════════════════════════════════════════
# Nginx Configuration for SmartLedger
# ════════════════════════════════════════════════════════════════════════════════════
# This reverse proxy configuration provides:
# - Load balancing, SSL termination, static file serving, security headers

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ═══════════════════════════════════════════════════════════════════════════════════
    # Logging Configuration
    # ═══════════════════════════════════════════════════════════════════════════════════
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log;

    # ═══════════════════════════════════════════════════════════════════════════════════
    # Performance Settings
    # ═══════════════════════════════════════════════════════════════════════════════════
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript 
               application/javascript application/xml+rss application/json;

    # ═══════════════════════════════════════════════════════════════════════════════════
    # Upstream Configuration (Backend Services)
    # ═══════════════════════════════════════════════════════════════════════════════════
    upstream smartledger_app {
        server app:5000;
        # Add more app instances here for load balancing
        # server app2:5000;
    }

    # ═══════════════════════════════════════════════════════════════════════════════════
    # HTTP Server Configuration
    # ═══════════════════════════════════════════════════════════════════════════════════
    server {
        listen 80;
        server_name localhost smartledger.local;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Referrer-Policy "strict-origin-when-cross-origin";

        # ───────────────────────────────────────────────────────────────────────────────
        # Static Files (CSS, JS, Images)
        # ───────────────────────────────────────────────────────────────────────────────
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # ───────────────────────────────────────────────────────────────────────────────
        # Health Check Endpoint
        # ───────────────────────────────────────────────────────────────────────────────
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # ───────────────────────────────────────────────────────────────────────────────
        # Proxy to Spring Boot Application
        # ───────────────────────────────────────────────────────────────────────────────
        location / {
            proxy_pass http://smartledger_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts
            proxy_connect_timeout       60s;
            proxy_send_timeout          60s;
            proxy_read_timeout          60s;
            
            # Buffer settings
            proxy_buffering on;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }

    # ═══════════════════════════════════════════════════════════════════════════════════
    # HTTPS Server Configuration (Uncomment for SSL)
    # ═══════════════════════════════════════════════════════════════════════════════════
    # server {
    #     listen 443 ssl http2;
    #     server_name localhost smartledger.local;
    #     
    #     ssl_certificate /etc/nginx/ssl/cert.pem;
    #     ssl_certificate_key /etc/nginx/ssl/key.pem;
    #     
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_prefer_server_ciphers off;
    #     
    #     # Same location blocks as HTTP server
    #     location /static/ {
    #         alias /var/www/static/;
    #         expires 1y;
    #         add_header Cache-Control "public, immutable";
    #     }
    #     
    #     location / {
    #         proxy_pass http://smartledger_app;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto https;
    #     }
    # }
}
